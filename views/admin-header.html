<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Admin - Header Component</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #fdf6ec;
            padding: 20px;
        }

        /* Top Capsule Header Row (Desktop Only) */
        .dashboard-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        /* Floating Pill Nav Capsule - Full Width Adjusted */
        .header-nav-capsule {
            background: #ffffff;
            border: 2px solid #ffd79d;
            border-radius: 35px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(255, 183, 77, 0.12);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            box-sizing: border-box;
        }

        .header-pill {
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            background: #f8fafc;
            color: #475569;
            border: 1.5px solid #e2e8f0;
            white-space: nowrap;
            transition: all 0.2s ease;
            text-align: center;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .header-pill:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .header-pill.active {
            background: #008069;
            color: #ffffff;
            border-color: #008069;
            box-shadow: 0 4px 10px rgba(0, 128, 105, 0.25);
        }

        .header-pill.live-btn {
            background: #f0fdf4;
            color: #166534;
            border-color: #bbf7d0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .header-pill.logout {
            background: #ffffff;
            color: #b91c1c;
            border-color: #ffd79d;
        }

        .header-pill.logout:hover {
            background: #fee2e2;
        }

        /* Hidden in mobile viewport */
        @media (max-width: 768px) {
            .dashboard-top-row {
                display: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-top-row">
        <div class="header-nav-capsule">
            <a href="admin-dashboard.html" class="header-pill">
                <i class="fa-solid fa-chart-pie"></i> Dashboard
            </a>
            <a href="admin-deposits.html" class="header-pill">
                <i class="fa-solid fa-building-columns"></i> Deposits
            </a>
            <a href="admin-withdrawals.html" class="header-pill">
                <i class="fa-solid fa-money-bill-transfer"></i> Withdrawals
            </a>
            <a href="admin-banks.html" class="header-pill">
                <i class="fa-solid fa-wallet"></i> Banks
            </a>
            <a href="admin-users.html" class="header-pill">
                <i class="fa-solid fa-users"></i> Users
            </a>
            <a href="index.html" target="_blank" class="header-pill live-btn">
                <i class="fa-solid fa-globe"></i> Live Site
            </a>
            <a href="login.html" class="header-pill logout" onclick="triggerCustomLogout(event, 'login.html')">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </div>
    </div>

    <!-- Active Highlighting & Logout Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentPage = window.location.pathname.split('/').pop() || 'admin-dashboard.html';
            const links = document.querySelectorAll('.header-pill:not(.live-btn):not(.logout)');

            links.forEach(link => {
                const target = link.getAttribute('href');
                if (target === currentPage) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        });

        function triggerCustomLogout(e, redirectUrl) {
            e.preventDefault();
            if (confirm("Are you sure you want to logout from admin?")) {
                localStorage.removeItem('admin_session');
                window.location.href = redirectUrl;
            }
        }
    </script>
</body>

</html>
