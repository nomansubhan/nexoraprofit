<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Withdraw Funds - Nexora Capital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #050817;
            background-image: radial-gradient(ellipse at 50% 18%, rgba(27, 69, 112, .28), transparent 42%),
                radial-gradient(ellipse at 20% 75%, rgba(219, 49, 119, .12), transparent 35%),
                radial-gradient(ellipse at 85% 88%, rgba(25, 113, 184, .14), transparent 38%);
            color: #f1f5ff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: linear-gradient(180deg, rgba(8, 14, 31, .98), rgba(5, 9, 23, .98));
            padding: 20px 16px 140px;
            position: relative;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
            border-left: 1px solid rgba(115, 199, 255, .08);
            border-right: 1px solid rgba(115, 199, 255, .08);
            overflow-y: auto;
        }

        .screen-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .back-btn {
            font-size: 16px;
            color: #8ff1ff;
            text-decoration: none;
            width: 38px;
            height: 38px;
            background: rgba(8, 18, 39, .85);
            border: 1.5px solid #72e8ff;
            border-radius: 50%;
            display: grid;
            place-items: center;
            box-shadow: 0 0 16px rgba(68, 213, 255, .13);
            transition: transform 0.2s ease;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
            color: #eaf7ff;
            text-shadow: 0 0 12px rgba(91, 202, 255, .35);
        }

        .balance-card {
            background: linear-gradient(145deg, rgba(23, 34, 59, .96), rgba(10, 17, 36, .96));
            border: 1.5px solid rgba(185, 218, 255, .4);
            border-radius: 28px;
            padding: 22px 18px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        .balance-card small {
            font-size: 11px;
            font-weight: 800;
            color: #b7c4d9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-card h2 {
            font-size: 34px;
            font-weight: 900;
            color: #ff5c77;
            margin-top: 4px;
            text-shadow: 0 0 20px rgba(255, 92, 119, 0.4);
        }

        .limit-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            margin-top: 10px;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .withdraw-form-card {
            background: linear-gradient(145deg, rgba(23, 34, 59, .9), rgba(10, 17, 36, .95));
            border: 1.5px solid rgba(185, 218, 255, .3);
            border-radius: 28px;
            padding: 22px 18px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #b7c4d9;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-box {
            background: rgba(13, 22, 43, 0.9);
            border: 1.5px solid rgba(187, 220, 255, .3);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .input-box input {
            border: 0;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 13px;
            font-weight: 700;
            color: #f8fafc;
        }

        .input-box select {
            border: 0;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 13px;
            font-weight: 700;
            color: #f8fafc;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-right: 20px;
        }

        .input-box select option {
            background: #0b1120;
            color: #f8fafc;
            padding: 12px;
            font-weight: 600;
        }

        .btn-gradient {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 25px;
            background: linear-gradient(145deg, #14b8a6, #047857);
            color: #fff;
            border: 1px solid rgba(161, 255, 225, .5);
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.4);
            margin-top: 16px;
            text-align: center;
            text-decoration: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .btn-gradient:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .alert-box {
            display: none;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .alert-success {
            background: rgba(20, 184, 166, 0.2);
            color: #34d399;
            border: 1px solid rgba(20, 184, 166, 0.4);
        }

        .bottom-nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: min(calc(100% - 24px), 400px);
            height: 66px;
            background: rgba(13, 22, 43, .94);
            border: 1.5px solid rgba(190, 220, 255, .72);
            backdrop-filter: blur(25px);
            border-radius: 36px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, .65), inset 0 1px 2px rgba(255, 255, 255, .2);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #c4ccdd;
            font-size: 10px;
            font-weight: 700;
        }

        .nav-item.active {
            color: #8deaff;
            text-shadow: 0 0 12px rgba(20, 184, 166, .45);
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .fab-center {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(145deg, #e6f7ff, #5d9bcf 55%, #192a4d);
            color: #14203a;
            border: 4px solid #0a1022;
            display: grid;
            place-items: center;
            font-size: 22px;
            font-weight: 900;
            margin-top: -34px;
            box-shadow: 0 0 16px rgba(93, 202, 255, .35), inset 0 2px 3px rgba(255, 255, 255, .65);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="mobile-frame">
        <div class="screen-header">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="header-title">Withdraw Funds</h2>
        </div>

        <div class="balance-card">
            <small>Available Balance</small>
            <h2 id="availableBalanceDisplay">Rs. 0</h2>
            <div class="limit-pill"><i class="fa-solid fa-shield-halved"></i> Minimum Withdrawal: Rs. 60</div>
        </div>

        <!-- Feedback Alerts -->
        <div class="alert-box alert-error" id="withdrawErrorAlert">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="withdrawErrorMsg">Amount exceeds your current balance.</span>
        </div>

        <div class="alert-box alert-success" id="withdrawSuccessAlert">
            <i class="fa-solid fa-circle-check"></i>
            <span id="withdrawSuccessMsg">Withdrawal request submitted successfully!</span>
        </div>

        <div class="withdraw-form-card">
            <form id="withdrawForm" onsubmit="handleWithdrawSubmit(event)">
                <div class="form-group">
                    <label>Amount (PKR)</label>
                    <div class="input-box">
                        <i class="fa-solid fa-coins" style="color: #34d399;"></i>
                        <input type="number" id="withdrawAmount" min="60" value="60" placeholder="Enter amount (min 60)"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Select Gateway / Bank</label>
                    <div class="input-box">
                        <i class="fa-solid fa-building-columns" style="color: #34d399;"></i>
                        <select id="withdrawMethod" required>
                            <option value="" disabled selected>Select Bank / Wallet</option>
                            <option value="EasyPaisa">EasyPaisa</option>
                            <option value="JazzCash">JazzCash</option>
                            <option value="SadaPay">SadaPay</option>
                            <option value="NayaPay">NayaPay</option>
                            <option value="Meezan Bank">Meezan Bank</option>
                            <option value="Allied Bank">Allied Bank</option>
                            <option value="Bank Alfalah">Bank Alfalah</option>
                            <option value="Faysal Bank">Faysal Bank</option>
                            <option value="HBL">HBL</option>
                            <option value="JS Bank">JS Bank</option>
                            <option value="Khushhali Bank">Khushhali Bank</option>
                            <option value="Mashreq Bank">Mashreq Bank</option>
                            <option value="MCB">MCB</option>
                            <option value="UBL">UBL</option>
                            <option value="UPaisa">UPaisa</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Account Title / Name</label>
                    <div class="input-box">
                        <i class="fa-regular fa-user" style="color: #34d399;"></i>
                        <input type="text" id="withdrawAccountTitle" placeholder="e.g. Ali Khan" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Account Number / Mobile</label>
                    <div class="input-box">
                        <i class="fa-solid fa-phone" style="color: #34d399;"></i>
                        <input type="text" id="withdrawAccountNumber" placeholder="03XXXXXXXXX" required>
                    </div>
                </div>
                <button type="submit" class="btn-gradient">Submit Request</button>
            </form>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="invest.html" class="nav-item"><i class="fa-solid fa-chart-line"></i><span>Active</span></a>
            <a href="invest.html" class="fab-center">N</a>
            <a href="withdraw-history.html" class="nav-item active"><i
                    class="fa-solid fa-money-bill-transfer"></i><span>Logs</span></a>
            <a href="profile.html" class="nav-item"><i class="fa-regular fa-user"></i><span>Profile</span></a>
        </nav>
    </div>

    <!-- Client-Side JavaScript Logic -->
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            currentUser = JSON.parse(localStorage.getItem('user_session')) || {
                id: 1,
                username: "noman",
                balance: 14500
            };

            updateBalanceDisplay();
        });

        function updateBalanceDisplay() {
            const balance = Number(currentUser.balance || 0);
            document.getElementById('availableBalanceDisplay').innerText = `Rs. ${balance.toLocaleString()}`;
        }

        function handleWithdrawSubmit(e) {
            e.preventDefault();

            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const method = document.getElementById('withdrawMethod').value;
            const accountTitle = document.getElementById('withdrawAccountTitle').value.trim();
            const accountNumber = document.getElementById('withdrawAccountNumber').value.trim();

            const errorAlert = document.getElementById('withdrawErrorAlert');
            const successAlert = document.getElementById('withdrawSuccessAlert');
            const errorMsg = document.getElementById('withdrawErrorMsg');

            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';

            if (!amount || amount < 60) {
                errorMsg.innerText = "Minimum withdrawal amount is Rs. 60.";
                errorAlert.style.display = 'block';
                return;
            }

            if (amount > Number(currentUser.balance || 0)) {
                errorMsg.innerText = "Insufficient balance for this withdrawal request.";
                errorAlert.style.display = 'block';
                return;
            }

            // Deduct balance from active session and persist
            currentUser.balance = Number(currentUser.balance || 0) - amount;
            localStorage.setItem('user_session', JSON.stringify(currentUser));
            updateBalanceDisplay();

            // Construct withdrawal record
            const newWithdrawal = {
                id: Date.now(),
                username: currentUser.username,
                amount: amount,
                method: method,
                accountTitle: accountTitle,
                accountNumber: accountNumber,
                status: "Pending",
                date: new Date().toISOString()
            };

            // Synchronize with admin panel withdrawals dataset
            let adminWithdrawals = JSON.parse(localStorage.getItem('nexora_admin_withdrawals')) || [];
            adminWithdrawals.unshift(newWithdrawal);
            localStorage.setItem('nexora_admin_withdrawals', JSON.stringify(adminWithdrawals));

            successAlert.style.display = 'block';
            document.getElementById('withdrawForm').reset();
            document.getElementById('withdrawAmount').value = 60;

            setTimeout(() => {
                window.location.href = 'withdraw-history.html';
            }, 1400);
        }
    </script>
</body>

</html>
