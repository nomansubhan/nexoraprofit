<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Withdraw History - Nexora Capital</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #050817;
            background-image: radial-gradient(ellipse at 50% 18%, rgba(27, 69, 112, .28), transparent 42%),
                radial-gradient(ellipse at 20% 75%, rgba(219, 49, 119, .12), transparent 35%),
                radial-gradient(ellipse at 85% 88%, rgba(25, 113, 184, .14), transparent 38%);
            color: #f1f5ff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: linear-gradient(180deg, rgba(8, 14, 31, .98), rgba(5, 9, 23, .98));
            padding: 20px 16px 110px;
            position: relative;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
            border-left: 1px solid rgba(115, 199, 255, .08);
            border-right: 1px solid rgba(115, 199, 255, .08);
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            background: rgba(8, 18, 39, .85);
            border: 1.5px solid #72e8ff;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #8ff1ff;
            text-decoration: none;
            font-size: 14px;
            box-shadow: 0 0 16px rgba(68, 213, 255, .13);
            transition: transform 0.2s ease;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .history-title {
            font-size: 18px;
            font-weight: 900;
            color: #eaf7ff;
            text-align: center;
            line-height: 1.1;
            text-shadow: 0 0 12px rgba(91, 202, 255, .35);
        }

        .filter-toggle-btn {
            width: 38px;
            height: 38px;
            background: rgba(8, 18, 39, .85);
            border: 1.5px solid #72e8ff;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #14b8a6;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(68, 213, 255, .13);
        }

        .summary-card {
            background: linear-gradient(145deg, rgba(23, 34, 59, .96), rgba(10, 17, 36, .96));
            border: 1.5px solid rgba(185, 218, 255, .4);
            border-radius: 28px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        .summary-icon {
            width: 52px;
            height: 52px;
            background: rgba(20, 184, 166, 0.2);
            color: #34d399;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 22px;
            border: 1px solid rgba(20, 184, 166, 0.4);
        }

        .summary-info small {
            font-size: 11px;
            font-weight: 700;
            color: #b7c4d9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-info h2 {
            font-size: 26px;
            font-weight: 900;
            color: #ff5c77;
            line-height: 1.1;
            text-shadow: 0 0 20px rgba(255, 92, 119, 0.4);
        }

        .summary-info p {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(145deg, rgba(23, 34, 59, .8), rgba(10, 17, 36, .9));
            border: 1.5px solid rgba(185, 218, 255, .25);
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .stat-icon {
            width: 38px;
            height: 38px;
            background: rgba(14, 165, 233, 0.2);
            color: #38bdf8;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 15px;
            border: 1px solid rgba(14, 165, 233, 0.4);
        }

        .stat-box.pending .stat-icon {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.4);
        }

        .stat-box span {
            display: block;
            font-size: 16px;
            font-weight: 900;
            color: #f8fafc;
        }

        .stat-box small {
            font-size: 11px;
            color: #b7c4d9;
            font-weight: 700;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 900;
            color: #eaf7ff;
        }

        .badge-recent {
            background: rgba(20, 184, 166, 0.2);
            color: #34d399;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 10px;
            border: 1px solid rgba(20, 184, 166, 0.4);
        }

        .filter-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .filter-tab {
            background: linear-gradient(145deg, rgba(23, 34, 59, .8), rgba(10, 17, 36, .9));
            border: 1.5px solid rgba(185, 218, 255, .25);
            border-radius: 14px;
            padding: 8px 4px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: #b7c4d9;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .filter-tab.active {
            background: linear-gradient(145deg, #14b8a6, #047857);
            color: #ffffff;
            border-color: rgba(161, 255, 225, .6);
            box-shadow: 0 4px 15px rgba(20, 184, 166, 0.4);
        }

        /* Withdrawal Card List Item Styles */
        .withdrawals-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .withdraw-item-card {
            background: linear-gradient(145deg, rgba(23, 34, 59, .9), rgba(10, 17, 36, .95));
            border: 1.5px solid rgba(185, 218, 255, .25);
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .withdraw-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .method-icon-box {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(126, 34, 206, 0.15);
            border: 1px solid rgba(126, 34, 206, 0.35);
            color: #c084fc;
            display: grid;
            place-items: center;
            font-size: 16px;
        }

        .withdraw-method-title {
            font-size: 13px;
            font-weight: 800;
            color: #f8fafc;
            line-height: 1.2;
        }

        .withdraw-account-sub {
            font-size: 10px;
            color: #94a3b8;
            font-weight: 600;
            margin-top: 2px;
        }

        .withdraw-date {
            font-size: 9px;
            color: #64748b;
            margin-top: 2px;
        }

        .withdraw-right {
            text-align: right;
        }

        .withdraw-amount {
            font-size: 15px;
            font-weight: 900;
            color: #ff5c77;
            text-shadow: 0 0 10px rgba(255, 92, 119, 0.3);
            margin-bottom: 4px;
        }

        .status-badge-custom {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .status-badge-custom.paid,
        .status-badge-custom.approved {
            background: rgba(20, 184, 166, 0.2);
            color: #34d399;
            border: 1px solid rgba(20, 184, 166, 0.4);
        }

        .status-badge-custom.pending {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.4);
        }

        .status-badge-custom.rejected,
        .status-badge-custom.canceled {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .empty-state {
            background: linear-gradient(145deg, rgba(23, 34, 59, .7), rgba(10, 17, 36, .85));
            border: 2px dashed rgba(185, 218, 255, .3);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .empty-icon {
            width: 60px;
            height: 60px;
            background: rgba(20, 184, 166, 0.2);
            color: #34d399;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 24px;
            margin: 0 auto 14px;
            border: 1px solid rgba(20, 184, 166, 0.4);
        }

        .empty-state h3 {
            font-size: 15px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .btn-withdraw-funds {
            display: inline-block;
            width: 100%;
            padding: 13px;
            background: linear-gradient(145deg, #14b8a6, #047857);
            color: #ffffff;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(161, 255, 225, .5);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .btn-withdraw-funds:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* Floating Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: min(calc(100% - 24px), 400px);
            height: 66px;
            background: rgba(13, 22, 43, .94);
            border: 1.5px solid rgba(190, 220, 255, .72);
            backdrop-filter: blur(25px);
            border-radius: 36px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, .65), inset 0 1px 2px rgba(255, 255, 255, .2);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #c4ccdd;
            font-size: 10px;
            font-weight: 700;
        }

        .nav-item.active {
            color: #8deaff;
            text-shadow: 0 0 12px rgba(20, 184, 166, .45);
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .fab-center {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(145deg, #e6f7ff, #5d9bcf 55%, #192a4d);
            color: #14203a;
            border: 4px solid #0a1022;
            display: grid;
            place-items: center;
            font-size: 22px;
            font-weight: 900;
            margin-top: -34px;
            box-shadow: 0 0 16px rgba(93, 202, 255, .35), inset 0 2px 3px rgba(255, 255, 255, .65);
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="mobile-frame">
        <div class="history-header">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="history-title">Withdraw<br>History</div>
            <div class="filter-toggle-btn" onclick="toggleQuickSort()"><i class="fa-solid fa-sliders"></i></div>
        </div>

        <!-- Summary Card -->
        <div class="summary-card">
            <div class="summary-icon"><i class="fa-solid fa-money-bill-transfer"></i></div>
            <div class="summary-info">
                <small>Total Withdrawn</small>
                <h2 id="totalWithdrawnSum">Rs 0</h2>
                <p id="totalRecordsText">0 withdrawal records</p>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
                <div>
                    <span id="approvedCountText">0</span>
                    <small>Approved</small>
                </div>
            </div>
            <div class="stat-box pending">
                <div class="stat-icon"><i class="fa-solid fa-clock"></i></div>
                <div>
                    <span id="pendingCountText">0</span>
                    <small>Pending</small>
                </div>
            </div>
        </div>

        <!-- Section Header -->
        <div class="section-header">
            <div class="section-title">Recent Withdrawals</div>
            <div class="badge-recent">Recent</div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <a href="javascript:void(0);" class="filter-tab active" onclick="setWithdrawFilter('all', this)">All</a>
            <a href="javascript:void(0);" class="filter-tab" onclick="setWithdrawFilter('approved', this)">Approved</a>
            <a href="javascript:void(0);" class="filter-tab" onclick="setWithdrawFilter('pending', this)">Pending</a>
            <a href="javascript:void(0);" class="filter-tab" onclick="setWithdrawFilter('rejected', this)">Canceled</a>
        </div>

        <!-- Dynamic Withdrawals List -->
        <div class="withdrawals-list" id="withdrawalsListContainer"></div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyWithdrawalsState">
            <div class="empty-icon"><i class="fa-solid fa-money-bill-transfer"></i></div>
            <h3>No withdrawal records</h3>
            <p>Your cashout requests will appear here.</p>
            <a href="withdraw.html" class="btn-withdraw-funds">Withdraw Funds <i class="fa-solid fa-arrow-right"
                    style="margin-left: 4px;"></i></a>
        </div>

        <!-- Floating Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="invest.html" class="nav-item"><i class="fa-solid fa-chart-line"></i><span>Active</span></a>
            <a href="invest.html" class="fab-center">N</a>
            <a href="withdraw-history.html" class="nav-item active"><i
                    class="fa-solid fa-clock-rotate-left"></i><span>Logs</span></a>
            <a href="profile.html" class="nav-item"><i class="fa-regular fa-user"></i><span>Profile</span></a>
        </nav>
    </div>

    <!-- Client-Side JavaScript Logic -->
    <script>
        let currentFilter = 'all';

        function getActiveUser() {
            return JSON.parse(localStorage.getItem('user_session')) || {
                username: "noman"
            };
        }

        function loadWithdrawals() {
            const user = getActiveUser();
            const currentUsername = (user.username || 'noman').toLowerCase();

            // Synchronize with the admin panel withdrawals pool
            const defaultRecords = [
                { id: 1, username: "noman", amount: 8000, method: "Sadapay", accountTitle: "Muhammad Noman", accountNumber: "03001234567", status: "Pending", date: "2026-10-31T12:00:00.000Z" },
                { id: 2, username: "noman", amount: 4500, method: "EasyPaisa", accountTitle: "Muhammad Noman", accountNumber: "03001234567", status: "Paid", date: "2026-10-24T15:30:00.000Z" },
                { id: 3, username: "noman", amount: 2000, method: "JazzCash", accountTitle: "Muhammad Noman", accountNumber: "03219876543", status: "Rejected", date: "2026-10-15T09:20:00.000Z" }
            ];

            let allWithdrawals = JSON.parse(localStorage.getItem('nexora_admin_withdrawals'));
            if (!allWithdrawals || allWithdrawals.length === 0) {
                allWithdrawals = defaultRecords;
                localStorage.setItem('nexora_admin_withdrawals', JSON.stringify(allWithdrawals));
            }

            // Filter for current active user
            return allWithdrawals.filter(w => (w.username || '').toLowerCase() === currentUsername);
        }

        function renderWithdrawHistory() {
            const userWithdrawals = loadWithdrawals();
            const container = document.getElementById('withdrawalsListContainer');
            const emptyState = document.getElementById('emptyWithdrawalsState');

            container.innerHTML = '';

            let totalWithdrawnSum = 0;
            let approvedCount = 0;
            let pendingCount = 0;

            userWithdrawals.forEach(w => {
                const s = (w.status || 'Pending').toLowerCase();
                if (s === 'paid' || s === 'approved') {
                    approvedCount++;
                    totalWithdrawnSum += Number(w.amount || 0);
                } else if (s === 'pending') {
                    pendingCount++;
                }
            });

            document.getElementById('totalWithdrawnSum').innerText = `Rs ${totalWithdrawnSum.toLocaleString()}`;
            document.getElementById('totalRecordsText').innerText = `${userWithdrawals.length} withdrawal records`;
            document.getElementById('approvedCountText').innerText = approvedCount;
            document.getElementById('pendingCountText').innerText = pendingCount;

            const filtered = userWithdrawals.filter(w => {
                const s = (w.status || 'Pending').toLowerCase();
                if (currentFilter === 'approved') return s === 'paid' || s === 'approved';
                if (currentFilter === 'pending') return s === 'pending';
                if (currentFilter === 'rejected') return s === 'rejected' || s === 'canceled';
                return true;
            });

            if (filtered.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            filtered.forEach(w => {
                const card = document.createElement('div');
                card.className = 'withdraw-item-card';

                const statusLower = (w.status || 'Pending').toLowerCase();
                const displayStatus = (statusLower === 'paid') ? 'Approved' : w.status;
                const formattedDate = w.date ? new Date(w.date).toLocaleDateString(undefined, {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                }) : 'Recent';

                card.innerHTML = `
                    <div class="withdraw-left">
                        <div class="method-icon-box">
                            <i class="fa-solid fa-building-columns"></i>
                        </div>
                        <div>
                            <div class="withdraw-method-title">${w.method}</div>
                            <div class="withdraw-account-sub">${w.accountTitle} • ${w.accountNumber}</div>
                            <div class="withdraw-date">${formattedDate}</div>
                        </div>
                    </div>
                    <div class="withdraw-right">
                        <div class="withdraw-amount">Rs ${Number(w.amount || 0).toLocaleString()}</div>
                        <span class="status-badge-custom ${statusLower}">${displayStatus}</span>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function setWithdrawFilter(filterType, tabElement) {
            currentFilter = filterType;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            tabElement.classList.add('active');
            renderWithdrawHistory();
        }

        function toggleQuickSort() {
            let all = JSON.parse(localStorage.getItem('nexora_admin_withdrawals')) || [];
            all.reverse();
            localStorage.setItem('nexora_admin_withdrawals', JSON.stringify(all));
            renderWithdrawHistory();
        }

        document.addEventListener('DOMContentLoaded', renderWithdrawHistory);
    </script>
</body>

</html>
