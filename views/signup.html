<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Sign Up - Nexora Capital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #050817;
            background-image: radial-gradient(ellipse at 50% 18%, rgba(27, 69, 112, .28), transparent 42%),
                radial-gradient(ellipse at 20% 75%, rgba(219, 49, 119, .12), transparent 35%),
                radial-gradient(ellipse at 85% 88%, rgba(25, 113, 184, .14), transparent 38%);
            color: #f1f5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 420px;
            padding: 20px 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #eaf7ff;
            text-shadow: 0 0 12px rgba(91, 202, 255, .35);
        }

        .brand-logo span {
            color: #14b8a6;
        }

        /* Avatar Container at Top of Card */
        .avatar-container {
            display: flex;
            justify-content: center;
            margin-bottom: -45px;
            z-index: 10;
        }

        .signup-avatar-circle {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9befff, #ff6a9f, #9befff);
            padding: 3.5px;
            box-shadow: 0 0 25px rgba(255, 85, 151, .45), 0 0 15px rgba(69, 215, 255, .3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0b1120;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .signup-card {
            background: linear-gradient(145deg, rgba(23, 34, 59, .96), rgba(10, 17, 36, .96));
            border: 1.5px solid rgba(185, 218, 255, .4);
            border-radius: 32px;
            padding: 55px 20px 24px 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        .signup-card h2 {
            font-size: 22px;
            font-weight: 900;
            color: #ff5c77;
            margin-bottom: 4px;
            text-shadow: 0 0 15px rgba(255, 92, 119, 0.4);
        }

        .signup-card p {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group label {
            font-size: 10px;
            font-weight: 800;
            color: #b7c4d9;
            display: block;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(13, 22, 43, 0.9);
            border: 1.5px solid rgba(187, 220, 255, .3);
            border-radius: 12px;
            outline: none;
            font-size: 12px;
            font-weight: 700;
            color: #f8fafc;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            border-color: #14b8a6;
        }

        .btn-gradient {
            width: 100%;
            padding: 13px;
            background: linear-gradient(145deg, #14b8a6, #047857);
            color: #fff;
            border: 1px solid rgba(161, 255, 225, .5);
            border-radius: 20px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            margin-top: 6px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .btn-gradient:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .error-badge {
            display: none;
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .success-badge {
            display: none;
            background: rgba(20, 184, 166, 0.2);
            color: #34d399;
            padding: 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
            border: 1px solid rgba(20, 184, 166, 0.4);
        }

        .auth-footer {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 14px;
            font-weight: 600;
        }

        .auth-footer a {
            color: #14b8a6;
            font-weight: 800;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(20, 184, 166, 0.3);
        }
    </style>
</head>

<body>
    <div class="mobile-frame">
        <header class="brand-header">
            <div class="brand-logo" id="brandLogoText">NEXORA <span>CAPITAL</span></div>
        </header>

        <!-- Avatar Icon on top of card -->
        <div class="avatar-container">
            <div class="signup-avatar-circle">
                <div class="avatar-inner">
                    <img src="https://cdn3d.iconscout.com/3d/premium/thumb/male-avatars-3d-icon-png-download-10764490.png"
                        alt="User Avatar">
                </div>
            </div>
        </div>

        <div class="signup-card">
            <h2>Sign Up</h2>
            <p>Create your new account</p>

            <div class="error-badge" id="signupErrorBadge">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorMessageText">Username or mobile already registered.</span>
            </div>

            <div class="success-badge" id="signupSuccessBadge">
                <i class="fa-solid fa-circle-check"></i>
                <span>Account registered successfully! Redirecting...</span>
            </div>

            <form id="signupForm" onsubmit="handleUserSignup(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="usernameInput" required placeholder="Enter username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="text" id="phoneInput" required placeholder="03XXXXXXXXX" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="passwordInput" required placeholder="********"
                        autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Referral Code (Optional)</label>
                    <input type="text" id="refInput" placeholder="Referral username">
                </div>
                <button type="submit" class="btn-gradient">Register Account</button>
            </form>
            <div class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <!-- Client-Side JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Update brand logo with project settings if configured
            const settings = JSON.parse(localStorage.getItem('nexora_project_settings'));
            if (settings && settings.projectName) {
                const parts = settings.projectName.trim().split(' ');
                const p1 = parts[0] || 'NEXORA';
                const p2 = parts.slice(1).join(' ') || 'CAPITAL';
                document.getElementById('brandLogoText').innerHTML = `${p1} <span>${p2}</span>`;
            }

            // Auto-fill referral code from URL parameter (?ref=...)
            const urlParams = new URLSearchParams(window.location.search);
            const refParam = urlParams.get('ref');
            if (refParam) {
                document.getElementById('refInput').value = refParam.trim();
            }

            // Redirect if already logged in
            const currentSession = JSON.parse(localStorage.getItem('user_session'));
            if (currentSession && (currentSession.id || currentSession.username)) {
                window.location.href = 'dashboard.html';
            }
        });

        function handleUserSignup(e) {
            e.preventDefault();

            const username = document.getElementById('usernameInput').value.trim().toLowerCase();
            const phone = document.getElementById('phoneInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const ref = document.getElementById('refInput').value.trim();

            const errorBadge = document.getElementById('signupErrorBadge');
            const successBadge = document.getElementById('signupSuccessBadge');
            const errorMsg = document.getElementById('errorMessageText');

            errorBadge.style.display = 'none';
            successBadge.style.display = 'none';

            // Basic Form Validations
            if (username.length < 3) {
                errorMsg.innerText = "Username must be at least 3 characters long.";
                errorBadge.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorMsg.innerText = "Password must be at least 6 characters long.";
                errorBadge.style.display = 'block';
                return;
            }

            // Load registered users from localStorage or default dataset
            const defaultUsers = [
                { id: 1, username: "noman", phone: "03001234567", password: "password123", balance: 14500, referredBy: "Direct" },
                { id: 2, username: "usman_khan", phone: "03129876543", password: "password123", balance: 5200, referredBy: "noman" },
                { id: 3, username: "ahmad_ali", phone: "03217654321", password: "password123", balance: 3000, referredBy: "Direct" }
            ];

            let users = JSON.parse(localStorage.getItem('nexora_registered_users')) || defaultUsers;

            // Check if username or phone already exists
            const existingUser = users.find(u => u.username.toLowerCase() === username || u.phone === phone);
            if (existingUser) {
                errorMsg.innerText = "Username or mobile number already registered.";
                errorBadge.style.display = 'block';
                return;
            }

            // Create new user object
            const newUser = {
                id: Date.now(),
                username: username,
                phone: phone,
                password: password,
                balance: 0,
                totalInvestment: 0,
                referredBy: ref || "Direct",
                createdAt: new Date().toISOString()
            };

            users.push(newUser);
            localStorage.setItem('nexora_registered_users', JSON.stringify(users));

            // Log user in directly
            const session = {
                id: newUser.id,
                username: newUser.username,
                phone: newUser.phone,
                balance: newUser.balance,
                referredBy: newUser.referredBy,
                loginTime: new Date().toISOString()
            };
            localStorage.setItem('user_session', JSON.stringify(session));

            successBadge.style.display = 'block';

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1200);
        }
    </script>
</body>

</html>
