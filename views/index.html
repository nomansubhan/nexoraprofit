<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Nexora Capital - Welcome</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #050817;
            background-image: radial-gradient(ellipse at 50% 18%, rgba(27, 69, 112, .28), transparent 42%),
                radial-gradient(ellipse at 20% 75%, rgba(219, 49, 119, .12), transparent 35%),
                radial-gradient(ellipse at 85% 88%, rgba(25, 113, 184, .14), transparent 38%);
            color: #f1f5ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
        }

        .screen-container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Top Circular Badge */
        .brand-badge {
            width: 135px;
            height: 135px;
            background: linear-gradient(145deg, rgba(23, 34, 59, .98), rgba(10, 17, 36, .98));
            border-radius: 50%;
            border: 2px solid rgba(115, 199, 255, .4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            margin-bottom: -68px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 20px rgba(52, 211, 153, 0.25);
            text-align: center;
        }

        .brand-badge-icon {
            font-size: 34px;
            color: #34d399;
            margin-bottom: 3px;
            filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.6));
        }

        .brand-badge-name {
            font-size: 13px;
            font-weight: 900;
            line-height: 1.1;
            color: #eaf7ff;
            letter-spacing: -0.3px;
            text-shadow: 0 0 10px rgba(91, 202, 255, 0.4);
        }

        .brand-badge-name span {
            color: #ff5c77;
            display: block;
            font-size: 11px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 92, 119, 0.4);
        }

        /* Main Welcome Card */
        .welcome-card {
            width: 100%;
            background: linear-gradient(145deg, rgba(23, 34, 59, .96), rgba(10, 17, 36, .96));
            border: 1.5px solid rgba(185, 218, 255, .4);
            border-radius: 36px;
            padding: 92px 24px 36px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 1;
        }

        .welcome-title {
            font-size: 38px;
            font-weight: 900;
            color: #eaf7ff;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(91, 202, 255, 0.4);
        }

        .welcome-subtitle {
            font-size: 14px;
            font-weight: 500;
            color: #b7c4d9;
            line-height: 1.4;
            max-width: 220px;
            margin: 0 auto 32px;
        }

        /* Action Buttons */
        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .btn-create {
            display: block;
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            background: linear-gradient(145deg, #14b8a6, #047857);
            color: #ffffff;
            font-size: 17px;
            font-weight: 900;
            text-decoration: none;
            border: 1px solid rgba(161, 255, 225, .5);
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease;
        }

        .btn-create:active {
            transform: scale(0.98);
        }

        .btn-login {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 30px;
            background: rgba(13, 22, 43, 0.9);
            color: #34d399;
            font-size: 17px;
            font-weight: 900;
            text-decoration: none;
            border: 2px solid rgba(52, 211, 153, 0.5);
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .btn-login:active {
            transform: scale(0.98);
            background: rgba(20, 184, 166, 0.15);
        }
    </style>
</head>

<body>

    <div class="screen-container">
        <!-- Top Circular Logo Badge -->
        <div class="brand-badge">
            <i class="fa-solid fa-chart-line brand-badge-icon"></i>
            <div class="brand-badge-name" id="displayBadgeName">
                NEXORA
                <span id="displayBadgeSub">CAPITAL</span>
            </div>
        </div>

        <!-- Main Welcome Card -->
        <div class="welcome-card">
            <h1 class="welcome-title">WELCOME</h1>
            <p class="welcome-subtitle">Get started with your account</p>

            <div class="actions-group">
                <a href="signup.html" class="btn-create">Create Account</a>
                <a href="login.html" class="btn-login">Login</a>
            </div>
        </div>
    </div>

    <!-- Client-Side Auto-Redirect & Configuration Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if user is already logged in
            const userSession = JSON.parse(localStorage.getItem('user_session'));
            if (userSession && (userSession.id || userSession.username)) {
                window.location.href = 'dashboard.html';
                return;
            }

            // Sync dynamic branding with project settings if configured
            const settings = JSON.parse(localStorage.getItem('nexora_project_settings'));
            if (settings && settings.projectName) {
                const parts = settings.projectName.trim().split(' ');
                const mainName = parts[0] || 'NEXORA';
                const subName = parts.slice(1).join(' ') || 'CAPITAL';

                document.getElementById('displayBadgeName').childNodes[0].nodeValue = mainName + '\n';
                document.getElementById('displayBadgeSub').innerText = subName;
            }
        });
    </script>
</body>

</html>
