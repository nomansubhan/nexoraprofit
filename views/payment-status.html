<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Payment Status - Nexora Capital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #050817;
            background-image: radial-gradient(ellipse at 50% 18%, rgba(27, 69, 112, .28), transparent 42%),
                radial-gradient(ellipse at 20% 75%, rgba(219, 49, 119, .12), transparent 35%),
                radial-gradient(ellipse at 85% 88%, rgba(25, 113, 184, .14), transparent 38%);
            color: #f1f5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .status-card {
            background: linear-gradient(145deg, rgba(23, 34, 59, .96), rgba(10, 17, 36, .96));
            border: 1.5px solid rgba(185, 218, 255, .4);
            border-radius: 32px;
            padding: 30px 20px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        .status-icon-box {
            width: 70px;
            height: 70px;
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 32px;
            margin: 0 auto 16px;
            border: 1px solid rgba(251, 191, 36, 0.4);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        .status-title {
            font-size: 20px;
            font-weight: 900;
            color: #eaf7ff;
            margin-bottom: 8px;
            text-shadow: 0 0 12px rgba(91, 202, 255, .35);
        }

        .status-desc {
            font-size: 12px;
            color: #b7c4d9;
            line-height: 1.5;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .deposit-meta-box {
            background: rgba(13, 22, 43, 0.8);
            border: 1px solid rgba(187, 220, 255, 0.2);
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 22px;
            text-align: left;
            font-size: 11px;
            color: #94a3b8;
            display: none;
        }

        .deposit-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .deposit-meta-row strong {
            color: #f8fafc;
        }

        .btn-dashboard {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(145deg, #14b8a6, #047857);
            color: #fff;
            border: 1px solid rgba(161, 255, 225, .5);
            border-radius: 25px;
            text-decoration: none;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.4);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .btn-dashboard:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="status-card">
        <div class="status-icon-box">
            <i class="fa-solid fa-clock"></i>
        </div>
        <h2 class="status-title">Request Submitted!</h2>
        <p class="status-desc">Your deposit request has been successfully submitted. Your balance will be updated after
            admin verification.</p>

        <!-- Optional Live Transaction Details -->
        <div class="deposit-meta-box" id="depositMetaBox">
            <div class="deposit-meta-row">
                <span>Method:</span>
                <strong id="metaMethod">EasyPaisa</strong>
            </div>
            <div class="deposit-meta-row">
                <span>Amount:</span>
                <strong style="color: #ff5c77;" id="metaAmount">Rs. 0</strong>
            </div>
            <div class="deposit-meta-row">
                <span>Trx ID:</span>
                <strong style="font-family: monospace;" id="metaTrxId">-</strong>
            </div>
        </div>

        <a href="dashboard.html" class="btn-dashboard">Go to Dashboard</a>
    </div>

    <!-- Client-Side JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Retrieve latest deposit submission from localStorage if available
            const adminDeposits = JSON.parse(localStorage.getItem('admin_deposits_all')) || [];
            if (adminDeposits.length > 0) {
                const latest = adminDeposits[0];
                document.getElementById('metaMethod').innerText = latest.method || 'Payment Gateway';
                document.getElementById('metaAmount').innerText = `Rs. ${Number(latest.amount || 0).toLocaleString()}`;
                document.getElementById('metaTrxId').innerText = latest.transactionId || '-';
                document.getElementById('depositMetaBox').style.display = 'block';
            }
        });
    </script>
</body>

</html>
