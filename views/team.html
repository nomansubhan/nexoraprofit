<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>My Team - Nexora Capital</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #050817;
            background-image: radial-gradient(ellipse at 50% 18%, rgba(27, 69, 112, .28), transparent 42%),
                radial-gradient(ellipse at 20% 75%, rgba(219, 49, 119, .12), transparent 35%),
                radial-gradient(ellipse at 85% 88%, rgba(25, 113, 184, .14), transparent 38%);
            color: #f1f5ff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: linear-gradient(180deg, rgba(8, 14, 31, .98), rgba(5, 9, 23, .98));
            padding: 20px 16px 110px;
            position: relative;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
            border-left: 1px solid rgba(115, 199, 255, .08);
            border-right: 1px solid rgba(115, 199, 255, .08);
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            background: rgba(8, 18, 39, .85);
            border: 1.5px solid #72e8ff;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #8ff1ff;
            text-decoration: none;
            font-size: 14px;
            box-shadow: 0 0 16px rgba(68, 213, 255, .13);
            transition: transform 0.2s ease;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .history-title {
            font-size: 20px;
            font-weight: 900;
            color: #eaf7ff;
            text-align: center;
            line-height: 1.1;
            text-shadow: 0 0 12px rgba(91, 202, 255, .35);
        }

        .summary-card {
            background: linear-gradient(145deg, rgba(23, 34, 59, .96), rgba(10, 17, 36, .96));
            border: 1.5px solid rgba(185, 218, 255, .4);
            border-radius: 28px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        .summary-icon {
            width: 52px;
            height: 52px;
            background: rgba(20, 184, 166, 0.2);
            color: #34d399;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 22px;
            border: 1px solid rgba(20, 184, 166, 0.4);
        }

        .summary-info small {
            font-size: 11px;
            font-weight: 700;
            color: #b7c4d9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-info h2 {
            font-size: 28px;
            font-weight: 900;
            color: #ff5c77;
            line-height: 1.1;
            text-shadow: 0 0 20px rgba(255, 92, 119, 0.4);
        }

        .summary-info p {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(145deg, rgba(23, 34, 59, .8), rgba(10, 17, 36, .9));
            border: 1.5px solid rgba(185, 218, 255, .25);
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .stat-icon {
            width: 38px;
            height: 38px;
            background: rgba(20, 184, 166, 0.2);
            color: #34d399;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 15px;
            border: 1px solid rgba(20, 184, 166, 0.4);
        }

        .stat-box span {
            display: block;
            font-size: 16px;
            font-weight: 900;
            color: #f8fafc;
        }

        .stat-box small {
            font-size: 10px;
            color: #b7c4d9;
            font-weight: 700;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 900;
            color: #eaf7ff;
        }

        .badge-members {
            background: rgba(20, 184, 166, 0.2);
            color: #34d399;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(20, 184, 166, 0.4);
        }

        .levels-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .level-card {
            background: linear-gradient(145deg, rgba(23, 34, 59, .8), rgba(10, 17, 36, .9));
            border: 1.5px solid rgba(185, 218, 255, .25);
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .level-card small {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #b7c4d9;
            margin-bottom: 4px;
        }

        .level-card span {
            font-size: 20px;
            font-weight: 900;
            color: #f8fafc;
        }

        /* Dynamic Member Row Cards */
        .members-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .member-card-box {
            background: linear-gradient(145deg, rgba(23, 34, 59, .85), rgba(10, 17, 36, .95));
            border: 1.5px solid rgba(185, 218, 255, .25);
            border-radius: 18px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .member-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .member-avatar-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(20, 184, 166, 0.2);
            color: #34d399;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 800;
            border: 1px solid rgba(20, 184, 166, 0.4);
        }

        .member-name {
            font-size: 13px;
            font-weight: 800;
            color: #f8fafc;
        }

        .member-joined {
            font-size: 10px;
            color: #94a3b8;
            font-weight: 600;
        }

        .member-tag {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 8px;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .empty-state {
            background: linear-gradient(145deg, rgba(23, 34, 59, .7), rgba(10, 17, 36, .85));
            border: 2px dashed rgba(185, 218, 255, .3);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .empty-icon {
            width: 60px;
            height: 60px;
            background: rgba(20, 184, 166, 0.2);
            color: #34d399;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 24px;
            margin: 0 auto 14px;
            border: 1px solid rgba(20, 184, 166, 0.4);
        }

        .empty-state h3 {
            font-size: 15px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
        }

        /* Floating Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: min(calc(100% - 24px), 400px);
            height: 66px;
            background: rgba(13, 22, 43, .94);
            border: 1.5px solid rgba(190, 220, 255, .72);
            backdrop-filter: blur(25px);
            border-radius: 36px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, .65), inset 0 1px 2px rgba(255, 255, 255, .2);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #c4ccdd;
            font-size: 10px;
            font-weight: 700;
        }

        .nav-item.active {
            color: #8deaff;
            text-shadow: 0 0 12px rgba(20, 184, 166, .45);
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .fab-center {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(145deg, #e6f7ff, #5d9bcf 55%, #192a4d);
            color: #14203a;
            border: 4px solid #0a1022;
            display: grid;
            place-items: center;
            font-size: 22px;
            font-weight: 900;
            margin-top: -34px;
            box-shadow: 0 0 16px rgba(93, 202, 255, .35), inset 0 2px 3px rgba(255, 255, 255, .65);
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="mobile-frame">
        <div class="history-header">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="history-title">Referral<br>History</div>
            <div style="width: 38px;"></div>
        </div>

        <!-- Total Team Members Card -->
        <div class="summary-card">
            <div class="summary-icon"><i class="fa-solid fa-users"></i></div>
            <div class="summary-info">
                <small>Total Team Members</small>
                <h2 id="totalTeamCount">0</h2>
                <p>Build your network and unlock more rewards.</p>
            </div>
        </div>

        <!-- Investment & Commission Stats Grid -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-icon"><i class="fa-solid fa-wallet"></i></div>
                <div>
                    <small>Team Investment</small>
                    <span id="teamInvestmentText">Rs 0</span>
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-icon"><i class="fa-solid fa-coins"></i></div>
                <div>
                    <small>Referral Commission</small>
                    <span id="referralCommissionText">Rs 0</span>
                </div>
            </div>
        </div>

        <!-- Team Levels Header -->
        <div class="section-header">
            <div class="section-title">Team Levels</div>
            <div class="badge-members" id="teamMembersBadge">0 members</div>
        </div>

        <!-- Team Levels Cards -->
        <div class="levels-grid">
            <div class="level-card">
                <small>All Team</small>
                <span id="allTeamCountText">0</span>
            </div>
            <div class="level-card">
                <small>Level 1</small>
                <span id="level1CountText">0</span>
            </div>
        </div>

        <!-- Team Members Section -->
        <div class="section-header">
            <div class="section-title">Team Members</div>
            <i class="fa-solid fa-users" style="color: #34d399; font-size: 18px;"></i>
        </div>

        <!-- Dynamic Member List -->
        <div class="members-list" id="teamMembersListContainer"></div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyTeamState">
            <div class="empty-icon"><i class="fa-solid fa-users"></i></div>
            <h3>No team members yet</h3>
            <p>Invite friends to start building your team.</p>
        </div>

        <!-- Floating Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="invest.html" class="nav-item"><i class="fa-solid fa-chart-line"></i><span>Active</span></a>
            <a href="invest.html" class="fab-center">N</a>
            <a href="withdraw-history.html" class="nav-item"><i
                    class="fa-solid fa-clock-rotate-left"></i><span>Logs</span></a>
            <a href="profile.html" class="nav-item"><i class="fa-regular fa-user"></i><span>Profile</span></a>
        </nav>
    </div>

    <!-- Client-Side JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Retrieve active session
            const userSession = JSON.parse(localStorage.getItem('user_session')) || {
                username: "noman"
            };

            const currentUsername = (userSession.username || 'noman').toLowerCase();

            // Load registered users from database / localStorage
            const defaultUsers = [
                { id: 1, username: "noman", phone: "03001234567", balance: 14500, referredBy: "Direct" },
                { id: 2, username: "usman_khan", phone: "03129876543", balance: 5200, referredBy: "noman", totalInvestment: 25000, createdAt: "2026-10-14" },
                { id: 3, username: "ahmad_ali", phone: "03217654321", balance: 3000, referredBy: "noman", totalInvestment: 15000, createdAt: "2026-10-22" },
                { id: 4, username: "hamza99", phone: "03451122334", balance: 890, referredBy: "usman_khan", totalInvestment: 5000, createdAt: "2026-10-25" }
            ];

            const allUsers = JSON.parse(localStorage.getItem('nexora_registered_users')) || defaultUsers;

            // Direct referrals (Level 1)
            const level1Members = allUsers.filter(u => (u.referredBy || '').toLowerCase() === currentUsername);

            // Level 2 referrals (Referred by Level 1 members)
            const level1Names = level1Members.map(u => u.username.toLowerCase());
            const level2Members = allUsers.filter(u => level1Names.includes((u.referredBy || '').toLowerCase()));

            const totalTeam = [...level1Members, ...level2Members];

            // Calculate Team Investment & Commission (10% on L1, 3% on L2)
            let totalInvestment = 0;
            let totalCommission = 0;

            level1Members.forEach(m => {
                const inv = Number(m.totalInvestment || 7000);
                totalInvestment += inv;
                totalCommission += (inv * 0.10);
            });

            level2Members.forEach(m => {
                const inv = Number(m.totalInvestment || 3500);
                totalInvestment += inv;
                totalCommission += (inv * 0.03);
            });

            // Update UI Counters
            document.getElementById('totalTeamCount').innerText = totalTeam.length;
            document.getElementById('teamInvestmentText').innerText = `Rs ${totalInvestment.toLocaleString()}`;
            document.getElementById('referralCommissionText').innerText = `Rs ${totalCommission.toLocaleString()}`;
            document.getElementById('teamMembersBadge').innerText = `${totalTeam.length} members`;
            document.getElementById('allTeamCountText').innerText = totalTeam.length;
            document.getElementById('level1CountText').innerText = level1Members.length;

            const listContainer = document.getElementById('teamMembersListContainer');
            const emptyState = document.getElementById('emptyTeamState');

            listContainer.innerHTML = '';

            if (totalTeam.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            totalTeam.forEach(member => {
                const isL1 = (member.referredBy || '').toLowerCase() === currentUsername;
                const levelLabel = isL1 ? 'Level 1' : 'Level 2';
                const initial = (member.username || 'U').charAt(0).toUpperCase();
                const joinDate = member.createdAt ? new Date(member.createdAt).toLocaleDateString() : 'Active Member';

                const card = document.createElement('div');
                card.className = 'member-card-box';
                card.innerHTML = `
                    <div class="member-left">
                        <div class="member-avatar-circle">${initial}</div>
                        <div>
                            <div class="member-name">@${member.username}</div>
                            <div class="member-joined">${joinDate}</div>
                        </div>
                    </div>
                    <span class="member-tag">${levelLabel}</span>
                `;

                listContainer.appendChild(card);
            });
        });
    </script>
</body>

</html>
