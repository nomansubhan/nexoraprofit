<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Login - Nexora Capital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #050817;
            background-image: radial-gradient(ellipse at 50% 18%, rgba(27, 69, 112, .28), transparent 42%),
                radial-gradient(ellipse at 20% 75%, rgba(219, 49, 119, .12), transparent 35%),
                radial-gradient(ellipse at 85% 88%, rgba(25, 113, 184, .14), transparent 38%);
            color: #f1f5ff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: linear-gradient(180deg, rgba(8, 14, 31, .98), rgba(5, 9, 23, .98));
            padding: 20px 16px;
            position: relative;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 1px solid rgba(115, 199, 255, .08);
            border-right: 1px solid rgba(115, 199, 255, .08);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #eaf7ff;
            text-shadow: 0 0 12px rgba(91, 202, 255, .35);
        }

        .brand-logo span {
            color: #14b8a6;
        }

        /* Avatar Container at Top of Card */
        .avatar-container {
            display: flex;
            justify-content: center;
            margin-bottom: -45px;
            z-index: 10;
        }

        .login-avatar-circle {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9befff, #ff6a9f, #9befff);
            padding: 3.5px;
            box-shadow: 0 0 25px rgba(255, 85, 151, .45), 0 0 15px rgba(69, 215, 255, .3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0b1120;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-card {
            background: linear-gradient(145deg, rgba(23, 34, 59, .96), rgba(10, 17, 36, .96));
            border: 1.5px solid rgba(185, 218, 255, .4);
            border-radius: 32px;
            padding: 55px 20px 26px 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        .login-card h2 {
            font-size: 24px;
            font-weight: 900;
            color: #ff5c77;
            margin-bottom: 4px;
            text-shadow: 0 0 15px rgba(255, 92, 119, 0.4);
        }

        .login-card p {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #b7c4d9;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-wrap {
            background: rgba(13, 22, 43, 0.9);
            border: 1.5px solid rgba(187, 220, 255, .3);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .input-wrap i {
            color: #14b8a6;
            font-size: 15px;
        }

        .input-wrap input {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 13px;
            font-weight: 700;
            color: #f8fafc;
        }

        .btn-gradient {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 25px;
            background: linear-gradient(145deg, #14b8a6, #047857);
            color: #fff;
            border: 1px solid rgba(161, 255, 225, .5);
            font-size: 15px;
            font-weight: 900;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            margin-top: 15px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .btn-gradient:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .error-badge {
            display: none;
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 15px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
        }

        .auth-footer a {
            color: #14b8a6;
            font-weight: 800;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(20, 184, 166, 0.3);
        }
    </style>
</head>

<body>
    <div class="mobile-frame">
        <header class="brand-header">
            <div class="brand-logo" id="brandLogoText">NEXORA <span>CAPITAL</span></div>
        </header>

        <!-- Avatar Icon on top of card -->
        <div class="avatar-container">
            <div class="login-avatar-circle">
                <div class="avatar-inner">
                    <img src="https://cdn3d.iconscout.com/3d/premium/thumb/male-avatars-3d-icon-png-download-10764490.png"
                        alt="User Avatar">
                </div>
            </div>
        </div>

        <div class="login-card">
            <h2>Welcome Back</h2>
            <p>Login to your account</p>

            <div class="error-badge" id="loginErrorBadge">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorMessageText">Invalid credentials. Please try again.</span>
            </div>

            <form id="loginForm" onsubmit="handleUserLogin(event)">
                <div class="form-group">
                    <label>Mobile Number</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-phone"></i>
                        <input type="text" id="phoneInput" placeholder="03001234567" required autocomplete="tel">
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="passwordInput" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn-gradient">Login</button>
            </form>
        </div>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Create Account</a>
        </div>
    </div>

    <!-- Client-Side JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Update brand logo with project settings if configured
            const settings = JSON.parse(localStorage.getItem('nexora_project_settings'));
            if (settings && settings.projectName) {
                const parts = settings.projectName.trim().split(' ');
                const p1 = parts[0] || 'NEXORA';
                const p2 = parts.slice(1).join(' ') || 'CAPITAL';
                document.getElementById('brandLogoText').innerHTML = `${p1} <span>${p2}</span>`;
            }

            // Redirect if already logged in
            const currentSession = JSON.parse(localStorage.getItem('user_session'));
            if (currentSession && (currentSession.id || currentSession.username)) {
                window.location.href = 'dashboard.html';
            }
        });

        function handleUserLogin(e) {
            e.preventDefault();

            const phone = document.getElementById('phoneInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorBadge = document.getElementById('loginErrorBadge');
            const errorMsg = document.getElementById('errorMessageText');

            errorBadge.style.display = 'none';

            // Get registered users from localStorage or initialize with demo list
            const defaultUsers = [
                { id: 1, username: "noman", phone: "03001234567", password: "password123", balance: 14500, referredBy: "Direct" },
                { id: 2, username: "usman_khan", phone: "03129876543", password: "password123", balance: 5200, referredBy: "noman" },
                { id: 3, username: "ahmad_ali", phone: "03217654321", password: "password123", balance: 3000, referredBy: "Direct" }
            ];

            let users = JSON.parse(localStorage.getItem('nexora_registered_users'));
            if (!users || users.length === 0) {
                users = defaultUsers;
                localStorage.setItem('nexora_registered_users', JSON.stringify(users));
            }

            // Verify credentials against registered users
            const matchedUser = users.find(u =>
                (u.phone === phone || u.username === phone) &&
                (u.password === password || !u.password)
            );

            if (!matchedUser) {
                errorMsg.innerText = "Invalid mobile number or password.";
                errorBadge.style.display = 'block';
                return;
            }

            // Store active user session
            const session = {
                id: matchedUser.id,
                username: matchedUser.username,
                phone: matchedUser.phone,
                balance: matchedUser.balance || 0,
                referredBy: matchedUser.referredBy || 'Direct',
                loginTime: new Date().toISOString()
            };

            localStorage.setItem('user_session', JSON.stringify(session));

            // Redirect to dashboard
            window.location.href = 'dashboard.html';
        }
    </script>
</body>

</html>
