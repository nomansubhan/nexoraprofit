<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Packages - Nexora Capital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #050817;
            background-image: radial-gradient(ellipse at 50% 18%, rgba(27, 69, 112, .28), transparent 42%),
                radial-gradient(ellipse at 20% 75%, rgba(219, 49, 119, .12), transparent 35%),
                radial-gradient(ellipse at 85% 88%, rgba(25, 113, 184, .14), transparent 38%);
            color: #f1f5ff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: linear-gradient(180deg, rgba(8, 14, 31, .98), rgba(5, 9, 23, .98));
            padding: 20px 16px 110px;
            position: relative;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
            border-left: 1px solid rgba(115, 199, 255, .08);
            border-right: 1px solid rgba(115, 199, 255, .08);
        }

        .screen-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            background: rgba(8, 18, 39, .85);
            border: 1.5px solid #72e8ff;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #8ff1ff;
            text-decoration: none;
            font-size: 14px;
            box-shadow: 0 0 16px rgba(68, 213, 255, .13);
            transition: transform 0.2s ease;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .header-title {
            font-size: 20px;
            font-weight: 900;
            color: #eaf7ff;
            text-shadow: 0 0 12px rgba(91, 202, 255, .35);
        }

        .package-card {
            background: linear-gradient(145deg, rgba(23, 34, 59, .96), rgba(10, 17, 36, .96));
            border: 1.5px solid rgba(185, 218, 255, .4);
            border-radius: 28px;
            padding: 20px 18px;
            margin-bottom: 16px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        .package-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 14px;
        }

        .crown-icon {
            width: 46px;
            height: 46px;
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 18px;
            border: 1px solid rgba(251, 191, 36, 0.4);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        .pkg-title {
            font-size: 16px;
            font-weight: 900;
            color: #f8fafc;
        }

        .pkg-sub {
            font-size: 10px;
            color: #b7c4d9;
            font-weight: 600;
            text-transform: uppercase;
        }

        .pkg-price-label {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 700;
            margin-top: 2px;
        }

        .pkg-price-label span {
            color: #ff5c77;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255, 92, 119, 0.4);
        }

        .pkg-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-cell {
            background: rgba(13, 22, 43, 0.9);
            border: 1.5px solid rgba(187, 220, 255, .2);
            border-radius: 16px;
            padding: 10px 12px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .stat-cell small {
            display: block;
            font-size: 10px;
            color: #b7c4d9;
            font-weight: 700;
            text-transform: uppercase;
        }

        .stat-cell strong {
            font-size: 14px;
            font-weight: 900;
            color: #f8fafc;
        }

        .green-text {
            color: #34d399 !important;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
        }

        .referral-box {
            background: rgba(13, 22, 43, 0.6);
            border: 1px solid rgba(187, 220, 255, .15);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .ref-title {
            font-size: 10px;
            font-weight: 800;
            color: #b7c4d9;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .ref-levels {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .ref-level-pill {
            background: rgba(20, 184, 166, 0.1);
            border: 1px solid rgba(20, 184, 166, 0.3);
            border-radius: 10px;
            padding: 6px;
            text-align: center;
        }

        .ref-level-pill span {
            display: block;
            font-size: 9px;
            color: #94a3b8;
            font-weight: 700;
        }

        .ref-level-pill strong {
            font-size: 11px;
            color: #34d399;
            font-weight: 900;
        }

        .btn-gradient {
            display: block;
            width: 100%;
            padding: 13px;
            border-radius: 25px;
            background: linear-gradient(145deg, #14b8a6, #047857);
            color: #fff;
            border: 1px solid rgba(161, 255, 225, .5);
            font-size: 14px;
            font-weight: 900;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .btn-gradient:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* Floating Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: min(calc(100% - 24px), 400px);
            height: 66px;
            background: rgba(13, 22, 43, .94);
            border: 1.5px solid rgba(190, 220, 255, .72);
            backdrop-filter: blur(25px);
            border-radius: 36px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, .65), inset 0 1px 2px rgba(255, 255, 255, .2);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #c4ccdd;
            font-size: 10px;
            font-weight: 700;
        }

        .nav-item.active {
            color: #8deaff;
            text-shadow: 0 0 12px rgba(20, 184, 166, .45);
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .fab-center {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(145deg, #e6f7ff, #5d9bcf 55%, #192a4d);
            color: #14203a;
            border: 4px solid #0a1022;
            display: grid;
            place-items: center;
            font-size: 22px;
            font-weight: 900;
            margin-top: -34px;
            box-shadow: 0 0 16px rgba(93, 202, 255, .35), inset 0 2px 3px rgba(255, 255, 255, .65);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="mobile-frame">
        <div class="screen-header"
            style="position: sticky; top: 0; background: linear-gradient(180deg, rgba(8, 14, 31, .98), rgba(5, 9, 23, .98)); padding: 10px 0; z-index: 100;">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="header-title">Investment Plans</h2>
            <div style="width: 38px;"></div>
        </div>

        <!-- Dynamic Packages Container -->
        <div id="packagesContainer"></div>

        <!-- Integrated Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="invest.html" class="nav-item active"><i class="fa-solid fa-chart-line"></i><span>Active</span></a>
            <a href="invest.html" class="fab-center">N</a>
            <a href="withdraw-history.html" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i><span>Logs</span></a>
            <a href="profile.html" class="nav-item"><i class="fa-regular fa-user"></i><span>Profile</span></a>
        </nav>
    </div>

    <!-- Client-Side JavaScript Logic -->
    <script>
        const defaultPackages = [
            {
                id: 1,
                name: "Bronze Starter",
                price: 1500,
                daily: 105,
                total: 4725,
                days: 45,
                returnRate: "315%",
                l1: 10,
                l2: 3,
                l3: 1
            },
            {
                id: 2,
                name: "Silver Growth",
                price: 3500,
                daily: 260,
                total: 11700,
                days: 45,
                returnRate: "334%",
                l1: 12,
                l2: 4,
                l3: 2
            },
            {
                id: 3,
                name: "Gold Executive",
                price: 7000,
                daily: 560,
                total: 25200,
                days: 45,
                returnRate: "360%",
                l1: 14,
                l2: 5,
                l3: 2
            },
            {
                id: 4,
                name: "Platinum Elite",
                price: 15000,
                daily: 1275,
                total: 57375,
                days: 45,
                returnRate: "382%",
                l1: 16,
                l2: 6,
                l3: 3
            }
        ];

        function renderPackages() {
            const packages = JSON.parse(localStorage.getItem('nexora_investment_packages')) || defaultPackages;
            const container = document.getElementById('packagesContainer');
            container.innerHTML = '';

            packages.forEach(pkg => {
                const card = document.createElement('div');
                card.className = 'package-card';
                card.innerHTML = `
                    <div class="package-top">
                        <div class="crown-icon"><i class="fa-solid fa-crown"></i></div>
                        <div>
                            <h3 class="pkg-title">${pkg.name}</h3>
                            <div class="pkg-sub">Investment package</div>
                            <div class="pkg-price-label">Package Price: <span>Rs. ${Number(pkg.price).toLocaleString()}</span></div>
                        </div>
                    </div>

                    <div class="pkg-stats-grid">
                        <div class="stat-cell">
                            <small>Daily Profit</small>
                            <strong>Rs. ${Number(pkg.daily).toLocaleString()}</strong>
                        </div>
                        <div class="stat-cell">
                            <small>Total Profit</small>
                            <strong>Rs. ${Number(pkg.total).toLocaleString()}</strong>
                        </div>
                        <div class="stat-cell">
                            <small>Plan Duration</small>
                            <strong>${pkg.days} Days</strong>
                        </div>
                        <div class="stat-cell">
                            <small>Total Return</small>
                            <strong class="green-text">${pkg.returnRate}</strong>
                        </div>
                    </div>

                    <div class="referral-box">
                        <div class="ref-title">Referral Commission</div>
                        <div class="ref-levels">
                            <div class="ref-level-pill">
                                <span>Level 1</span>
                                <strong>${pkg.l1}%</strong>
                            </div>
                            <div class="ref-level-pill">
                                <span>Level 2</span>
                                <strong>${pkg.l2}%</strong>
                            </div>
                            <div class="ref-level-pill">
                                <span>Level 3</span>
                                <strong>${pkg.l3}%</strong>
                            </div>
                        </div>
                    </div>

                    <a href="payment-method.html?pkg=${pkg.id}" onclick="selectPackage(${pkg.id})" class="btn-gradient">Invest Now</a>
                `;
                container.appendChild(card);
            });
        }

        function selectPackage(pkgId) {
            const packages = JSON.parse(localStorage.getItem('nexora_investment_packages')) || defaultPackages;
            const selected = packages.find(p => p.id === pkgId);
            if (selected) {
                localStorage.setItem('selected_investment_package', JSON.stringify(selected));
            }
        }

        document.addEventListener('DOMContentLoaded', renderPackages);
    </script>
</body>

</html>
