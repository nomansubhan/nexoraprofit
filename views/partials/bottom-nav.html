<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottom Nav</title>
    <!-- Font Awesome CDN Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            padding-bottom: 75px; /* نیویگیشن بار کے نیچے مواد کو چھپنے سے روکنے کے لیے */
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: #111827;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid #1f2937;
            z-index: 1000;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            text-decoration: none;
            font-size: 11px;
            gap: 4px;
            flex: 1;
            transition: color 0.2s ease;
        }

        .bottom-nav .nav-item i {
            font-size: 18px;
        }

        .bottom-nav .nav-item.active {
            color: #3b82f6;
        }

        .bottom-nav .fab-center {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 700;
            font-size: 18px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            margin-top: -20px;
            border: 3px solid #111827;
            transition: transform 0.2s ease;
        }

        .bottom-nav .fab-center:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="invest.html" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Invest</span>
        </a>
        <a href="invest.html" class="fab-center">
            N
        </a>
        <a href="team.html" class="nav-item">
            <i class="fa-solid fa-users"></i>
            <span>Team</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fa-regular fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- Active Navigation Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            const navLinks = document.querySelectorAll('.bottom-nav .nav-item');

            navLinks.forEach(link => {
                const targetPage = link.getAttribute('href');
                if (targetPage === currentPage) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
