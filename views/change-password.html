<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Change Password - Nexora Capital</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #050817;
            background-image: radial-gradient(ellipse at 50% 18%, rgba(27, 69, 112, .28), transparent 42%),
                radial-gradient(ellipse at 20% 75%, rgba(219, 49, 119, .12), transparent 35%),
                radial-gradient(ellipse at 85% 88%, rgba(25, 113, 184, .14), transparent 38%);
            color: #f1f5ff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: linear-gradient(180deg, rgba(8, 14, 31, .98), rgba(5, 9, 23, .98));
            padding: 20px 16px 40px;
            position: relative;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
            border-left: 1px solid rgba(115, 199, 255, .08);
            border-right: 1px solid rgba(115, 199, 255, .08);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 24px;
        }

        .back-btn {
            position: absolute;
            left: 0;
            width: 38px;
            height: 38px;
            background: rgba(8, 18, 39, .85);
            border: 1.5px solid #72e8ff;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #8ff1ff;
            text-decoration: none;
            font-size: 14px;
            box-shadow: 0 0 16px rgba(68, 213, 255, .13);
            transition: transform 0.2s ease;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .title {
            font-size: 20px;
            font-weight: 900;
            color: #eaf7ff;
            text-shadow: 0 0 12px rgba(91, 202, 255, .35);
        }

        .form-card {
            background: linear-gradient(145deg, rgba(23, 34, 59, .96), rgba(10, 17, 36, .96));
            border: 1.5px solid rgba(185, 218, 255, .4);
            border-radius: 28px;
            padding: 22px 18px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #b7c4d9;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(13, 22, 43, 0.9);
            border: 1.5px solid rgba(187, 220, 255, .3);
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            color: #f8fafc;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            border-color: #14b8a6;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(145deg, #14b8a6, #047857);
            color: #ffffff;
            border: 1px solid rgba(161, 255, 225, .5);
            border-radius: 25px;
            font-weight: 900;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.4);
            margin-top: 14px;
            text-transform: uppercase;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn-submit:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .alert-success {
            display: none;
            background: rgba(20, 184, 166, 0.2);
            color: #34d399;
            padding: 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
            border: 1px solid rgba(20, 184, 166, 0.4);
        }

        .alert-error {
            display: none;
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
    </style>
</head>

<body>
    <div class="mobile-frame">
        <div class="header">
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="title">Change Password</div>
        </div>

        <div class="form-card">
            <!-- Feedback Banners -->
            <div class="alert-success" id="successAlert">
                <i class="fa-solid fa-circle-check" style="margin-right: 4px;"></i>
                <span id="successMessage">Password updated successfully!</span>
            </div>

            <div class="alert-error" id="errorAlert">
                <i class="fa-solid fa-circle-exclamation" style="margin-right: 4px;"></i>
                <span id="errorMessage">An error occurred.</span>
            </div>

            <form id="changePasswordForm" onsubmit="handleChangePassword(event)">
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" id="currentPassword" required placeholder="Enter Old Password">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" required placeholder="Enter New Password">
                </div>
                <button type="submit" class="btn-submit">Update Password</button>
            </form>
        </div>
    </div>

    <!-- Client-Side JavaScript Logic -->
    <script>
        function handleChangePassword(e) {
            e.preventDefault();

            const currentPass = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const successAlert = document.getElementById('successAlert');
            const errorAlert = document.getElementById('errorAlert');
            const errorMsg = document.getElementById('errorMessage');

            successAlert.style.display = 'none';
            errorAlert.style.display = 'none';

            // Validation Checks
            if (newPass.length < 6) {
                errorMsg.innerText = "New password must be at least 6 characters long.";
                errorAlert.style.display = 'block';
                return;
            }

            if (currentPass === newPass) {
                errorMsg.innerText = "New password cannot be the same as your old password.";
                errorAlert.style.display = 'block';
                return;
            }

            // Retrieve local user data
            let activeUser = JSON.parse(localStorage.getItem('user_session')) || {
                username: "noman",
                password: "password123"
            };

            // If a previous password was stored, verify it
            const storedPassword = localStorage.getItem('user_account_password') || activeUser.password || "password123";

            if (currentPass !== storedPassword) {
                errorMsg.innerText = "Incorrect current password. Please try again.";
                errorAlert.style.display = 'block';
                return;
            }

            // Save new password to localStorage
            localStorage.setItem('user_account_password', newPass);

            // Update user session if present
            if (activeUser) {
                activeUser.password = newPass;
                localStorage.setItem('user_session', JSON.stringify(activeUser));
            }

            successAlert.style.display = 'block';
            document.getElementById('changePasswordForm').reset();

            // Redirect back to profile after short delay
            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 1800);
        }
    </script>
</body>

</html>
